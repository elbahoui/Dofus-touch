
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Project
        run: |
          unzip -q DOFUS_AutoFarm_Android_v0.1.zip -d source

      - name: Build APK
        run: |
          gradle -p source/DOFUS_AutoFarm_Android :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dofus-Farm-APK
          path: source/DOFUS_AutoFarm_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
