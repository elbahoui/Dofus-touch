name: Build Android APK v0.2
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract v0.2 ZIP
        run: unzip -q DOFUS_Farm_Lab_v0.2.zip -d source
      - name: Assemble debug APK
        run: gradle -p source/DOFUS_Farm_Lab_v0.2 :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DOFUS-Farm-Lab-v0.2-APK
          path: source/DOFUS_Farm_Lab_v0.2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
